<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Run — The Great Turkey Escape</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #302421; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
  #frame { position: relative; width: min(100vw, 160dvh); aspect-ratio: 8 / 5; container-type: inline-size; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  button { position: absolute; pointer-events: auto; cursor: pointer; touch-action: none;
    padding: 0; border: 0; background: transparent; color: transparent; }
  button:focus-visible { outline: .24cqw solid #fff2ce; outline-offset: .35cqw; border-radius: .55cqw; }
  #go { left: 6.25%; top: 66%; width: 24%; height: 8.5%; }
  #mute { right: 3%; bottom: 5.5%; width: 4.3%; height: 5.85%; }
  .pace { bottom: 5.5%; width: 7.35%; height: 5.2%; }
  [data-hold="slow"] { right: 25%; }
  [data-hold="duck"] { right: 17.1%; }
  [data-hold="fast"] { right: 9.2%; }
  [data-screen="play"] #go, [data-screen]:not([data-screen="play"]) #pad { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main id="frame" data-screen="title">
  <canvas id="game" width="1280" height="800" aria-label="Gobble Run — The Great Turkey Escape"></canvas>
  <div class="overlay">
    <button id="go" type="button" aria-label="Run for it"></button>
    <div id="pad">
      <button type="button" class="pace" data-hold="slow" aria-label="Slow down"></button>
      <button type="button" class="pace" data-hold="duck" aria-label="Hold to slide"></button>
      <button type="button" class="pace" data-hold="fast" aria-label="Speed up"></button>
    </div>
    <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false"></button>
  </div>
  <p id="status" class="sr" role="status" aria-live="polite"></p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
